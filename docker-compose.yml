services:
  postgres:
    image: postgres:16-alpine
    container_name: estudeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estudeai
    ports:
      - "5432:5432"
    volumes:
      - estudeai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  estudeai-postgres-data:
